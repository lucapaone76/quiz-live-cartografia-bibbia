<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1464">
<title>Regia slide — Cartografia della Parola</title>
<link rel="stylesheet" href="slides/deck.css">
<link rel="stylesheet" href="slides/live.css">
<style>
  main { width:100%; max-width:1500px; margin:0 auto; padding:14px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .top .right { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:14px; }
  .grid { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
  @media (min-width:1000px) { .grid { grid-template-columns:minmax(0,2.1fr) minmax(300px,1fr); } }
  .box { width:100%; }
  #cur-box { height:min(56vw, calc(100vh - 290px)); min-height:180px; display:flex; align-items:center; justify-content:center; }
  #next-box { height:190px; display:flex; align-items:center; justify-content:center; }
  .side { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .label { font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin:0 0 6px; }
  .notes { background:rgba(255,255,255,.08); border-radius:14px; padding:12px 16px; font-size:16px; line-height:1.45; overflow:auto; max-height:46vh; }
  .notes a { color:#fde68a; }
  .notes p { margin:.3em 0; } .notes ul { margin:.3em 0; padding-left:1.2em; } .notes li { margin:.25em 0; }
  @media (max-width:999px) { .next-wrap { display:none; } .notes { max-height:none; } }
  main { overflow-x:hidden; }
  .ctrl { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin-top:14px; }
  @media (max-width:999px) {
    .ctrl { position:sticky; bottom:0; z-index:5; margin:10px -16px 0; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
            background:rgba(27,20,100,.94); backdrop-filter:blur(6px); gap:8px; }
    .ctrl button.nav { padding:16px 6px; font-size:19px; }
    .pos { min-width:0; font-size:13px; } .pos b { font-size:19px; }
    #cur-box { height:auto; }
  }
  .tools select { max-width:100%; }
  .ctrl button.nav { border:0; border-radius:18px; padding:20px 10px; font-size:22px; font-weight:800; cursor:pointer; }
  #prev { background:rgba(255,255,255,.15); color:#fff; }
  #next { background:#fff; color:#2a1470; }
  .ctrl button.nav:active { transform:scale(.97); }
  .ctrl button.nav:disabled { opacity:.35; cursor:default; }
  .pos { text-align:center; font-size:15px; line-height:1.35; min-width:120px; }
  .pos b { font-size:22px; }
  .dots { display:flex; gap:5px; justify-content:center; margin-top:4px; }
  .dots i { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.25); }
  .dots i.on { background:var(--gold); }
  .tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; border-top:1px solid rgba(255,255,255,.15); padding-top:12px; }
  .tools button, .tools a, .tools select { background:none; color:#fff; border:1.5px solid rgba(255,255,255,.35); border-radius:12px; padding:8px 14px; font-size:14px; cursor:pointer; text-decoration:none; }
  .tools select option { color:#000; }
  .tools a.quiz { background:var(--gold); color:#2a1470; border-color:var(--gold); font-weight:800; }
  .warn { background:#7f1d1d; border-radius:12px; padding:10px 14px; font-size:15px; }
  .share { display:flex; gap:18px; align-items:center; background:rgba(255,255,255,.08); border-radius:14px; padding:14px; flex-wrap:wrap; }
  .share .qr { background:#fff; padding:10px; border-radius:12px; line-height:0; }
  .share .qr svg { width:170px; height:170px; }
  .share code { background:rgba(255,255,255,.15); padding:3px 8px; border-radius:8px; word-break:break-all; }
  .keys { font-size:13px; opacity:.65; }
  input { width:220px; text-align:center; font-size:22px; }
</style>
</head>
<body>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
import { sb, TITLES, esc, deckFromUrl, loadDeck, numberPages, showPage, fitFrame, follow, presence } from './slides/live.js';

const DECK = deckFromUrl();
const OTHER = DECK === 1 ? 2 : 1;
document.title = 'Regia — ' + TITLES[DECK];
const app = document.getElementById('app');
const viewUrl = new URL(`slides.html?deck=${DECK}`, location.href).href;
const screenUrl = new URL(`slides.html?deck=${DECK}&schermo=1`, location.href).href;
const qrSvg = t => { try { const q = qrcode(0, 'M'); q.addData(t); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch { return ''; } };

let pin = sessionStorage.getItem('quiz_pin') || '';
let deck = null, cur = { slide: 0, step: 0 }, sentKey = '', sending = false, lastLocal = 0, viewers = 0, linkOk = null, shareOpen = false;
const keyOf = s => `${s.slide}|${s.step}`;

if (!pin) askPin(); else start();

function askPin(msg = '') {
  app.innerHTML = `<div class="center"><div class="big">🎬</div><h1>Regia delle slide</h1><p class="tag">${esc(TITLES[DECK])}</p>
    <p><input id="pin" type="password" placeholder="PIN" autofocus></p><p class="err">${esc(msg)}</p>
    <button class="main" id="go">Entra</button><p class="note">Lo stesso PIN del pannello del quiz.</p></div>`;
  const go = () => { pin = document.getElementById('pin').value.trim(); sessionStorage.setItem('quiz_pin', pin); start(); };
  document.getElementById('go').onclick = go;
  document.getElementById('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function start() {
  app.innerHTML = '<div class="center pulse">Connessione…</div>';
  try { deck = numberPages(await loadDeck(DECK, true)); }
  catch { app.innerHTML = '<div class="center"><h1>Non riesco a caricare le slide</h1><p>Controlla la connessione e ricarica.</p></div>'; return; }
  // Si riparte da dove si era rimasti; il PIN si controlla riscrivendo lo stesso stato.
  const { data } = await sb.from('slide_state').select('slide, step').eq('id', DECK).maybeSingle();
  if (data) cur = clamp({ slide: data.slide, step: data.step });
  const { error } = await sb.rpc('slide_set', { p_pin: pin, p_deck: DECK, p_slide: cur.slide, p_step: cur.step });
  if (error && error.code === 'P0001') { sessionStorage.removeItem('quiz_pin'); return askPin('PIN errato'); }
  if (!error) sentKey = keyOf(cur);
  shell(); render();
  if (error) warn(true);
  follow(DECK, row => {
    // Un'altra regia (per esempio il telefono usato come telecomando) ha cambiato pagina.
    if (sending || Date.now() - lastLocal < 2500 || keyOf(row) === keyOf(cur)) return;
    cur = clamp(row); sentKey = keyOf(cur); render();
  }, ok => { linkOk = ok; dot(); });
  presence(DECK, null, null, n => { viewers = n; const v = document.getElementById('viewers'); if (v) v.textContent = n; });
  window.addEventListener('resize', fitAll);
  document.addEventListener('keydown', onKey);
}

function clamp(s) {
  const last = deck.pages.length - 1;
  const slide = Math.max(0, Math.min(Number(s.slide) || 0, last));
  return { slide, step: Math.max(0, Math.min(Number(s.step) || 0, deck.pages[slide].steps)) };
}
const nextOf = s => s.step < deck.pages[s.slide].steps ? { slide: s.slide, step: s.step + 1 }
  : s.slide < deck.pages.length - 1 ? { slide: s.slide + 1, step: 0 } : null;
const prevOf = s => s.step > 0 ? { slide: s.slide, step: s.step - 1 }
  : s.slide > 0 ? { slide: s.slide - 1, step: deck.pages[s.slide - 1].steps } : null;

function go(s) { if (!s) return; cur = clamp(s); lastLocal = Date.now(); render(); push(); }

// Invia lo stato a Supabase uno alla volta, sempre l'ultimo: con molti clic veloci i telefoni non vanno avanti e indietro.
async function push() {
  if (sending) return;
  sending = true;
  while (keyOf(cur) !== sentKey) {
    const t = { ...cur };
    const { error } = await sb.rpc('slide_set', { p_pin: pin, p_deck: DECK, p_slide: t.slide, p_step: t.step });
    if (error) {
      if (error.code === 'P0001') { sending = false; sessionStorage.removeItem('quiz_pin'); return askPin('PIN errato'); }
      warn(true); await new Promise(r => setTimeout(r, 1500)); continue;
    }
    warn(false); sentKey = keyOf(t); lastLocal = Date.now();
  }
  sending = false;
}

function onKey(e) {
  if (e.target.closest('input, select, textarea')) return;
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); go(nextOf(cur)); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); go(prevOf(cur)); }
  else if (k === 'Home') go({ slide: 0, step: 0 });
  else if (k === 'End') go({ slide: deck.pages.length - 1, step: 0 });
}

function shell() {
  const opts = deck.pages.map((p, i) => `<option value="${i}">${p.n}. ${esc(p.title)}</option>`).join('');
  app.innerHTML = `<div class="top"><span class="tag">🎬 Regia · ${esc(TITLES[DECK])}</span>
      <span class="right"><span class="live" id="dot">collegamento…</span><span>📱 <b id="viewers">${viewers}</b> telefoni collegati</span></span></div>
    <div id="warn"></div>
    <div class="grid">
      <div class="box"><div id="cur-box"><div class="frame"><div class="deck ghost" id="cur"></div></div></div>
        <div class="ctrl"><button class="nav" id="prev">◀ Indietro</button><div class="pos" id="pos"></div><button class="nav" id="next">Avanti ▶</button></div></div>
      <div class="side">
        <div class="next-wrap"><p class="label">Prossimo clic</p><div id="next-box"><div class="frame"><div class="deck" id="nxt"></div></div></div></div>
        <div><p class="label">Note per chi parla</p><div class="notes" id="notes"></div></div>
      </div>
    </div>
    <div class="tools">
      <select id="jump" aria-label="Vai alla slide">${opts}</select>
      <button id="share">📱 Link per i partecipanti</button>
      <a href="${esc(screenUrl)}" target="_blank" rel="opener">🖥️ Schermo per il proiettore</a>
      <a href="regia.html?deck=${OTHER}">↔ Vai alla parte ${OTHER}</a>
      <span id="quiz"></span>
      <span class="keys">Tastiera e telecomandi: → ↓ Pagina giù Spazio = avanti · ← ↑ Pagina su = indietro</span>
    </div>
    <div id="share-box"></div>`;
  document.getElementById('prev').onclick = () => go(prevOf(cur));
  document.getElementById('next').onclick = () => go(nextOf(cur));
  document.getElementById('jump').onchange = e => { go({ slide: Number(e.target.value), step: 0 }); e.target.blur(); };
  document.getElementById('share').onclick = () => { shareOpen = !shareOpen; drawShare(); };
  dot();
}

function drawShare() {
  document.getElementById('share-box').innerHTML = shareOpen ? `<div class="share"><div class="qr">${qrSvg(viewUrl)}</div>
    <div><p>Chi apre questo link segue le tue slide sul telefono, pagina per pagina:</p><p><code>${esc(viewUrl)}</code></p>
    <p class="note">Scrivono il nome una volta sola: è lo stesso del quiz, con lo stesso numero.</p></div></div>` : '';
}

function render() {
  if (!document.getElementById('cur')) return;
  const page = deck.pages[cur.slide];
  showPage(document.getElementById('cur'), page, cur.step);
  const nx = nextOf(cur);
  const nh = document.getElementById('nxt');
  if (nx) showPage(nh, deck.pages[nx.slide], nx.step); else { nh.innerHTML = ''; nh.dataset.page = ''; }
  document.getElementById('notes').innerHTML = deck.notes[cur.slide] || '<p class="note">Nessuna nota.</p>';
  document.querySelectorAll('#notes a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  const last = deck.pages[deck.pages.length - 1].n;
  const dots = page.steps ? `<div class="dots">${Array.from({ length: page.steps + 1 }, (_, i) => `<i class="${i <= cur.step ? 'on' : ''}"></i>`).join('')}</div>` : '';
  document.getElementById('pos').innerHTML = `Slide <b>${page.n}</b> di ${last}<br><span class="note">pagina ${cur.slide + 1} di ${deck.pages.length}${page.steps ? ` · passo ${cur.step} di ${page.steps}` : ''}</span>${dots}`;
  document.getElementById('prev').disabled = !prevOf(cur);
  document.getElementById('next').disabled = !nx;
  document.getElementById('jump').value = String(cur.slide);
  document.getElementById('quiz').innerHTML = page.quiz
    ? `<a class="quiz" href="presenter.html?quiz=${page.quiz}" target="_blank" rel="opener">🎛️ Apri il pannello del quiz ${page.quiz}</a>` : '';
  fitAll();
}

function fitAll() {
  const c = document.querySelector('#cur-box .frame'), n = document.querySelector('#next-box .frame');
  if (c) fitFrame(c, document.getElementById('cur-box'));
  if (n && n.offsetParent) fitFrame(n, document.getElementById('next-box'));
}

function dot() {
  const d = document.getElementById('dot'); if (!d) return;
  d.className = 'live' + (linkOk === true ? ' on' : linkOk === false ? ' off' : '');
  d.textContent = linkOk === false ? 'riconnessione…' : linkOk ? 'in diretta' : 'collegamento…';
}

function warn(on) {
  const w = document.getElementById('warn');
  if (w) w.innerHTML = on ? '<div class="warn">⚠️ Il cambio di pagina non arriva ai telefoni: connessione assente o lenta. Riprovo da solo.</div>' : '';
}
</script>
</body>
</html>
