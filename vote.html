<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Cartografia della Parola</title>
<style>
  :root { --bg1:#1b1464; --bg2:#4a1d8f; --card:rgba(255,255,255,.1); --ok:#22c55e; --ko:#ef4444; --gold:#fbbf24; --txt:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt);
         background: linear-gradient(160deg,var(--bg1),var(--bg2)); display:flex; justify-content:center; }
  main { width:100%; max-width:520px; padding:16px 16px 40px; display:flex; flex-direction:column; gap:16px; }
  .bar-top { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; opacity:.85; }
  .mynum { font-size:20px; margin:0; } .mynum b { background:var(--gold); color:#2a1470; border-radius:12px; padding:2px 12px; font-size:26px; }
  .bar-top .num { background:var(--gold); color:#2a1470; border-radius:999px; padding:2px 9px; font-size:13px; margin-right:4px; }
  .bar-top button { background:none; border:0; color:inherit; text-decoration:underline; font-size:14px; cursor:pointer; padding:0; }
  .tag { font-size:13px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  h1 { font-size:24px; line-height:1.25; margin:0; }
  .center { text-align:center; margin-top:12vh; display:flex; flex-direction:column; gap:12px; align-items:center; }
  .center .big { font-size:56px; }
  .opt { position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; width:100%; text-align:left;
         background:var(--card); border:2px solid rgba(255,255,255,.18); color:var(--txt); border-radius:16px;
         padding:16px; font-size:18px; cursor:pointer; transition:transform .1s, border-color .2s, opacity .3s; }
  .opt:active { transform:scale(.98); }
  .opt[disabled] { cursor:default; }
  .opt .letter { flex:0 0 34px; height:34px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-weight:700; z-index:1; }
  .opt .label { flex:1; z-index:1; }
  .opt .pct { font-weight:700; z-index:1; font-variant-numeric:tabular-nums; }
  .opt .bar { position:absolute; inset:0 auto 0 0; width:0; background:rgba(255,255,255,.22); transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .opt.mine { border-color:#fff; }
  .opt.correct { border-color:var(--ok); box-shadow:0 0 0 4px rgba(34,197,94,.35), 0 0 30px rgba(34,197,94,.5); }
  .opt.correct .bar { background:rgba(34,197,94,.5); }
  .opt.wrong { border-color:var(--ko); }
  .opt.wrong .bar { background:rgba(239,68,68,.45); }
  .opt.dim { opacity:.45; }
  .note { text-align:center; opacity:.85; min-height:24px; margin:0; }
  .verdict { text-align:center; font-size:22px; font-weight:700; margin:0; }
  .explain { background:rgba(255,255,255,.08); border-left:4px solid var(--gold); border-radius:10px; padding:12px 14px; font-size:15px; line-height:1.4; }
  .explain img { display:block; width:100%; border-radius:8px; margin-top:10px; }
  .score { text-align:center; font-size:15px; opacity:.85; }
  .podium { width:100%; display:flex; flex-direction:column; gap:8px; }
  .podium div { display:flex; justify-content:space-between; background:var(--card); border-radius:12px; padding:12px 16px; font-size:18px; }
  .podium div.me { outline:2px solid var(--gold); }
  form { display:flex; flex-direction:column; gap:12px; width:100%; }
  input { font-size:20px; padding:14px 16px; border-radius:14px; border:0; width:100%; }
  button.main { background:#fff; color:#2a1470; border:0; border-radius:14px; padding:14px 22px; font-size:18px; font-weight:800; cursor:pointer; }
  .err { color:#fecaca; min-height:20px; margin:0; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
</style>
</head>
<body>
<main id="app"><div class="center pulse">Connessione…</div></main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://igadvmjzyrylaxpacrew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fIO4K5Q3L63lnp4iuwn_hw_qZOc0NAb';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const QUIZ = new URLSearchParams(location.search).get('quiz') === '2' ? 2 : 1;
const TITLES = { 1: 'Quiz 1 · Cartografia della Parola', 2: 'Quiz 2 · Come approcciare il testo biblico' };
document.title = TITLES[QUIZ];
const LETTERS = ['A','B','C','D'];
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- Identità del dispositivo: un codice casuale salvato nel browser (memoria locale + cookie), niente account.
// Resta uguale anche se la pagina viene ricaricata o chiusa e riaperta sullo stesso telefono e browser.
const cookie = k => (document.cookie.split('; ').find(c => c.startsWith(k + '=')) || '').split('=').slice(1).join('=');
const remember = (k, v) => {
  try { localStorage.setItem(k, v); } catch {}
  document.cookie = `${k}=${encodeURIComponent(v)}; max-age=31536000; path=/; SameSite=Lax`;
};
const recall = k => { let v = null; try { v = localStorage.getItem(k); } catch {} return v || (cookie(k) ? decodeURIComponent(cookie(k)) : null); };

// crypto.randomUUID manca sui telefoni più vecchi (iOS < 15.4, Chrome < 92): in quel caso si genera lo stesso tipo di codice a mano.
const newId = () => (crypto.randomUUID ? crypto.randomUUID()
  : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
let sid = recall('quiz_sid');
if (!/^[0-9a-f-]{36}$/i.test(sid || '')) sid = newId();
remember('quiz_sid', sid);
let name = recall('quiz_name');
let myNum = null;   // numero fisso del partecipante: assegnato al primo nome, non cambia se cambia il nome

const mineKey = `quiz_mine_${QUIZ}`;
const loadMine = () => { try { return JSON.parse(localStorage.getItem(mineKey) || '{}'); } catch { return {}; } };
let mine = loadMine();
const saveMine = () => { try { localStorage.setItem(mineKey, JSON.stringify(mine)); } catch {} };

const qCache = {};
let shownKey = '', results = null, key = null, myScore = null, board = [], timer = null;

if (!name) askName(); else join(name).then(startLoop);

function askName(msg = '') {
  clearInterval(timer); timer = null; shownKey = '';
  app.innerHTML = `<div class="center"><div class="big">👋</div><h1>Come ti chiami?</h1>
    <p class="note">Il nome serve per la classifica finale. Resta legato a questo telefono.</p>
    <form id="f"><input id="n" maxlength="40" autocomplete="nickname" placeholder="Il tuo nome" value="${esc(name || '')}" required>
    <p class="err">${esc(msg)}</p><button class="main">Entra nel quiz</button></form></div>`;
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const n = document.getElementById('n').value.trim();
    if (!n) return;
    const ok = await join(n);
    if (!ok) return askName('Non riesco a registrare il nome: controlla la connessione e riprova.');
    startLoop();
  };
  document.getElementById('n').focus();
}

async function join(n) {
  const { error } = await sb.rpc('quiz_join', { p_session: sid, p_name: n });
  if (error) return false;
  name = n; remember('quiz_name', n);
  await loadNumber(false);
  return true;
}

// Legge il numero di questo telefono. Se manca (dopo «Azzera tutto» i nomi sono cancellati)
// si iscrive di nuovo con lo stesso nome e riceve un nuovo numero.
async function loadNumber(rejoin = true) {
  const { data, error } = await sb.rpc('quiz_my_number', { p_session: sid });
  if (error) return;
  if (data == null && rejoin && name) {
    const { error: e2 } = await sb.rpc('quiz_join', { p_session: sid, p_name: name });
    if (!e2) return loadNumber(false);
    return;
  }
  if (data !== myNum) { myNum = data; shownKey = ''; }
}

function startLoop() { shownKey = ''; tick(); if (!timer) timer = setInterval(tick, 1500); }

async function getQuestion(id) {
  if (!qCache[id]) {
    const { data } = await sb.from('quiz_questions').select('*').eq('id', id).single();
    if (data) qCache[id] = data;
    return data;
  }
  return qCache[id];
}

const header = () => `<div class="bar-top"><span>${esc(TITLES[QUIZ])}</span><span>${myNum ? `<b class="num">n. ${myNum}</b> ` : ''}👤 ${esc(name)} · <button id="chg">cambia</button></span></div>`;
function show(html) {
  app.innerHTML = header() + html;
  document.getElementById('chg').onclick = () => askName();
}

// Un aggiornamento alla volta: con una rete lenta i controlli ogni 1,5 s non si sovrappongono
// (una risposta vecchia potrebbe altrimenti ridisegnare lo schermo sopra una nuova).
let ticking = false, again = false, ticks = 0;
async function tick() {
  if (ticking) { again = true; return; }
  ticking = true;
  try {
    if (++ticks % 20 === 1) await loadNumber();   // ogni 30 secondi circa: controlla il numero (e si riscrive se è stato azzerato tutto)
    await refresh();
  } catch (e) { console.warn(e); }
  finally { ticking = false; if (again) { again = false; tick(); } }
}

async function refresh() {
  const { data: st, error } = await sb.from('quiz_state').select('*').eq('id', QUIZ).single();
  if (error || !st) return;
  const k = `${st.phase}:${st.current_question}:${mine[st.current_question] ?? '-'}`;
  if (k === shownKey) return;

  if (st.phase === 'waiting') {
    shownKey = k;
    if (Object.keys(mine).length) { mine = {}; saveMine(); }   // quiz azzerato: si riparte da capo
    return show(`<div class="center"><div class="big">⏳</div><h1>Il quiz sta per iniziare</h1>${myNum ? `<p class="mynum">Il tuo numero è <b>${myNum}</b></p>` : ''}<p class="note">Resta su questa pagina.</p></div>`);
  }
  if (st.phase === 'finished') {
    shownKey = k;
    const [{ data: s }, { data: b }] = await Promise.all([
      sb.rpc('quiz_my_score', { p_quiz: QUIZ, p_session: sid }),
      sb.rpc('quiz_leaderboard', { p_quiz: QUIZ })
    ]);
    const sc = (s && s[0]) || { correct: 0, revealed: 0 };
    board = b || [];
    const medals = ['🥇','🥈','🥉'];
    const pod = board.map(r => `<div class="${r.name === name ? 'me' : ''}"><span>${medals[r.place - 1]} ${esc(r.name)}</span><b>${r.correct}</b></div>`).join('');
    return show(`<div class="center"><div class="big">🎉</div><h1>Grazie per aver partecipato!</h1>
      <p class="verdict">Hai indovinato ${sc.correct} su ${sc.revealed}</p>
      ${pod ? `<p class="note">I primi tre</p><div class="podium">${pod}</div>` : ''}</div>`);
  }

  const q = st.current_question ? await getQuestion(st.current_question) : null;
  if (!q) return;                                   // domanda non ancora caricata: si riprova al prossimo giro
  const my = mine[q.id];
  results = null; key = null; myScore = null;
  if (st.phase === 'results' || st.phase === 'revealed') {
    const { data: rows } = await sb.rpc('quiz_results', { p_question: q.id });
    results = rows || [];
  }
  if (st.phase === 'revealed') {
    const [{ data: kk }, { data: s }] = await Promise.all([
      sb.from('quiz_keys').select('correct_index, note, image').eq('question_id', q.id).maybeSingle(),
      sb.rpc('quiz_my_score', { p_quiz: QUIZ, p_session: sid })
    ]);
    key = kk; myScore = s && s[0];
  }
  shownKey = k;
  renderQuestion(st, q, my);
  if (st.phase !== 'voting') requestAnimationFrame(() => requestAnimationFrame(animateBars));
}

function renderQuestion(st, q, my) {
  const total = (results || []).reduce((a, r) => a + Number(r.n), 0);
  const count = i => Number((results || []).find(r => r.choice === i)?.n || 0);
  const showPct = st.phase !== 'voting';
  const correct = key ? key.correct_index : null;
  const opts = q.options.map((text, i) => {
    let cls = 'opt';
    if (my === i) cls += ' mine';
    if (correct !== null) cls += i === correct ? ' correct' : (my === i ? ' wrong' : ' dim');
    const pct = total ? Math.round(count(i) / total * 100) : 0;
    const disabled = st.phase !== 'voting' || my !== undefined ? 'disabled' : '';
    return `<button class="${cls}" data-i="${i}" ${disabled}>
      <div class="bar" data-w="${showPct ? pct : 0}"></div>
      <span class="letter">${LETTERS[i]}</span><span class="label">${esc(text)}</span>
      ${showPct ? `<span class="pct">${pct}%</span>` : (my === i ? '<span class="pct">✓</span>' : '')}
    </button>`;
  }).join('');

  let foot = '';
  if (st.phase === 'voting') foot = my === undefined ? '<p class="note">Tocca la tua risposta</p>' : '<p class="note pulse">Risposta inviata ✓ — attendi i risultati…</p>';
  if (st.phase === 'results') foot = '<p class="note pulse">Ecco come ha risposto la sala… tra poco la risposta giusta</p>';
  if (st.phase === 'revealed') {
    if (my === undefined) foot = '<p class="note">Non hai risposto a questa domanda</p>';
    else if (correct === my) foot = '<p class="verdict">🎯 Giusto!</p>';
    else foot = '<p class="verdict">❌ Questa volta no</p>';
    if (key && (key.note || key.image)) foot += `<div class="explain">${esc(key.note)}${key.image ? `<img src="${esc(key.image)}" alt="">` : ''}</div>`;
    if (myScore) foot += `<p class="score">Finora hai indovinato ${myScore.correct} su ${myScore.revealed}</p>`;
  }
  show(`<div class="tag">Domanda ${q.position}</div><h1>${esc(q.text)}</h1><div style="display:flex;flex-direction:column;gap:10px">${opts}</div>${foot}`);
  app.querySelectorAll('button.opt:not([disabled])').forEach(b => b.addEventListener('click', () => vote(q.id, Number(b.dataset.i))));
}

function animateBars() { app.querySelectorAll('.bar').forEach(b => { b.style.width = b.dataset.w + '%'; }); }

async function vote(qid, choice) {
  mine[qid] = choice; saveMine();
  let { error } = await sb.from('quiz_votes').insert({ question_id: qid, session_id: sid, choice });
  if (error && error.code !== '23505') {           // forse il nome non è registrato (quiz azzerato): riprova una volta
    await join(name);
    ({ error } = await sb.from('quiz_votes').insert({ question_id: qid, session_id: sid, choice }));
  }
  if (error && error.code !== '23505') {            // 23505 = hai già votato
    delete mine[qid]; saveMine();
    shownKey = ''; await tick();
    const n = app.querySelector('.note'); if (n) n.textContent = 'Voto non registrato: le votazioni per questa domanda sono chiuse.';
    return;
  }
  shownKey = ''; tick();
}
</script>
</body>
</html>
