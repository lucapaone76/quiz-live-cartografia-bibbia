<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz live</title>
<style>
  :root { --bg1:#1b1464; --bg2:#4a1d8f; --card:rgba(255,255,255,.1); --ok:#22c55e; --ko:#ef4444; --txt:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt);
         background: linear-gradient(160deg,var(--bg1),var(--bg2)); display:flex; justify-content:center; }
  main { width:100%; max-width:520px; padding:20px 16px 40px; display:flex; flex-direction:column; gap:16px; }
  .tag { font-size:13px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  h1 { font-size:24px; line-height:1.25; margin:0; }
  .center { text-align:center; margin-top:18vh; }
  .center .big { font-size:56px; }
  .opt { position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; width:100%; text-align:left;
         background:var(--card); border:2px solid rgba(255,255,255,.18); color:var(--txt); border-radius:16px;
         padding:16px; font-size:18px; cursor:pointer; transition:transform .1s, border-color .2s, opacity .3s; }
  .opt:active { transform:scale(.98); }
  .opt[disabled] { cursor:default; }
  .opt .letter { flex:0 0 34px; height:34px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-weight:700; z-index:1; }
  .opt .label { flex:1; z-index:1; }
  .opt .pct { font-weight:700; z-index:1; font-variant-numeric:tabular-nums; }
  .opt .bar { position:absolute; inset:0 auto 0 0; width:0; background:rgba(255,255,255,.22); transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .opt.mine { border-color:#fff; }
  .opt.correct { border-color:var(--ok); box-shadow:0 0 0 4px rgba(34,197,94,.35), 0 0 30px rgba(34,197,94,.5); }
  .opt.correct .bar { background:rgba(34,197,94,.5); }
  .opt.wrong { border-color:var(--ko); }
  .opt.wrong .bar { background:rgba(239,68,68,.45); }
  .opt.dim { opacity:.45; }
  .note { text-align:center; opacity:.85; min-height:24px; }
  .verdict { text-align:center; font-size:22px; font-weight:700; }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.4; } }
</style>
</head>
<body>
<main id="app"><div class="center pulse">Connessione…</div></main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://igadvmjzyrylaxpacrew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fIO4K5Q3L63lnp4iuwn_hw_qZOc0NAb';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const LETTERS = ['A','B','C','D'];
const app = document.getElementById('app');

// Identità anonima del dispositivo (nessun account): serve solo a impedire doppi voti
let sid = localStorage.getItem('quiz_sid');
if (!sid) { sid = crypto.randomUUID(); localStorage.setItem('quiz_sid', sid); }
const load = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch { return {}; } };
const mine = load('quiz_mine');       // domanda -> scelta
const score = load('quiz_score');     // domanda -> true/false

const qCache = {};
let shownKey = '';
let results = null, correct = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function getQuestion(id) {
  if (!qCache[id]) {
    const { data } = await sb.from('quiz_questions').select('*').eq('id', id).single();
    qCache[id] = data;
  }
  return qCache[id];
}

async function tick() {
  const { data: st, error } = await sb.from('quiz_state').select('*').eq('id', 1).single();
  if (error || !st) { return; }
  const key = `${st.phase}:${st.current_question}:${mine[st.current_question] ?? '-'}`;
  if (key === shownKey) return;

  if (st.phase === 'waiting') { shownKey = key; return show('<div class="center"><div class="big">⏳</div><h1>Il quiz sta per iniziare</h1><p class="note">Resta su questa pagina.</p></div>'); }
  if (st.phase === 'finished') {
    shownKey = key;
    const tot = Object.keys(score).length, ok = Object.values(score).filter(Boolean).length;
    return show(`<div class="center"><div class="big">🎉</div><h1>Grazie per aver partecipato!</h1>${tot ? `<p class="note">Risposte giuste: <b>${ok}</b> su ${tot}</p>` : ''}</div>`);
  }

  const q = await getQuestion(st.current_question);
  const my = mine[q.id];

  if (st.phase === 'results' || st.phase === 'revealed') {
    const { data: rows } = await sb.rpc('quiz_results', { p_question: q.id });
    results = rows || [];
    correct = null;
    if (st.phase === 'revealed') {
      const { data: k } = await sb.from('quiz_keys').select('correct_index').eq('question_id', q.id).maybeSingle();
      correct = k ? k.correct_index : null;
      if (my !== undefined && correct !== null) { score[q.id] = (my === correct); localStorage.setItem('quiz_score', JSON.stringify(score)); }
    }
  }
  shownKey = key;
  renderQuestion(st, q, my);
  if (st.phase !== 'voting') requestAnimationFrame(() => requestAnimationFrame(animateBars));
}

function renderQuestion(st, q, my) {
  const total = (results || []).reduce((a, r) => a + Number(r.n), 0);
  const count = i => Number((results || []).find(r => r.choice === i)?.n || 0);
  const showPct = st.phase !== 'voting';
  const opts = q.options.map((text, i) => {
    let cls = 'opt';
    if (my === i) cls += ' mine';
    if (st.phase === 'revealed' && correct !== null) {
      if (i === correct) cls += ' correct';
      else if (my === i) cls += ' wrong';
      else cls += ' dim';
    }
    const pct = total ? Math.round(count(i) / total * 100) : 0;
    const disabled = st.phase !== 'voting' || my !== undefined ? 'disabled' : '';
    return `<button class="${cls}" data-i="${i}" ${disabled}>
      <div class="bar" data-w="${showPct ? pct : 0}"></div>
      <span class="letter">${LETTERS[i]}</span><span class="label">${esc(text)}</span>
      ${showPct ? `<span class="pct">${pct}%</span>` : (my === i ? '<span class="pct">✓</span>' : '')}
    </button>`;
  }).join('');

  let foot = '';
  if (st.phase === 'voting') foot = my === undefined ? '<p class="note">Tocca la tua risposta</p>' : '<p class="note pulse">Risposta inviata ✓ — attendi i risultati…</p>';
  if (st.phase === 'results') foot = '<p class="note pulse">Ecco come ha risposto la sala… tra poco la risposta giusta</p>';
  if (st.phase === 'revealed') {
    if (my === undefined) foot = '<p class="note">Non hai risposto a questa domanda</p>';
    else if (correct === my) foot = '<p class="verdict">🎯 Giusto!</p>';
    else foot = '<p class="verdict">❌ Questa volta no</p>';
  }
  show(`<div class="tag">Domanda ${q.position}</div><h1>${esc(q.text)}</h1><div style="display:flex;flex-direction:column;gap:10px">${opts}</div>${foot}`);
  app.querySelectorAll('button.opt:not([disabled])').forEach(b => b.addEventListener('click', () => vote(q.id, Number(b.dataset.i))));
}

function animateBars() { app.querySelectorAll('.bar').forEach(b => { b.style.width = b.dataset.w + '%'; }); }
function show(html) { app.innerHTML = html; }

async function vote(qid, choice) {
  mine[qid] = choice; localStorage.setItem('quiz_mine', JSON.stringify(mine));
  const { error } = await sb.from('quiz_votes').insert({ question_id: qid, session_id: sid, choice });
  if (error && error.code !== '23505') {          // 23505 = hai già votato
    delete mine[qid]; localStorage.setItem('quiz_mine', JSON.stringify(mine));
    alert('Voto non registrato: le votazioni sono chiuse.');
  }
  shownKey = ''; tick();
}

tick();
setInterval(tick, 1500);
</script>
</body>
</html>
