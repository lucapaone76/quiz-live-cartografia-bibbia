<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz live – Presentatore</title>
<style>
  :root { --bg1:#1b1464; --bg2:#4a1d8f; --card:rgba(255,255,255,.1); --ok:#22c55e; --txt:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt);
         background: linear-gradient(160deg,var(--bg1),var(--bg2)); display:flex; justify-content:center; }
  main { width:100%; max-width:980px; padding:28px 24px 48px; display:flex; flex-direction:column; gap:22px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .tag { font-size:14px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .link { font-size:14px; opacity:.8; }
  .link code { background:rgba(255,255,255,.15); padding:3px 8px; border-radius:8px; }
  h1 { font-size:clamp(26px,4.4vw,46px); line-height:1.2; margin:0; }
  .opts { display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:760px) { .opts { grid-template-columns:1fr 1fr; } }
  .opt { position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; border:3px solid rgba(255,255,255,.18);
         background:var(--card); border-radius:20px; padding:20px; font-size:clamp(18px,2.4vw,26px); transition:opacity .4s, border-color .3s, box-shadow .4s; }
  .opt .letter { flex:0 0 44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-weight:800; z-index:1; }
  .opt .label { flex:1; z-index:1; }
  .opt .pct { font-weight:800; font-size:1.2em; z-index:1; font-variant-numeric:tabular-nums; }
  .opt .bar { position:absolute; inset:0 auto 0 0; width:0; background:rgba(255,255,255,.24); transition:width 1s cubic-bezier(.2,.8,.2,1); }
  .opt.correct { border-color:var(--ok); box-shadow:0 0 0 6px rgba(34,197,94,.3), 0 0 50px rgba(34,197,94,.6); animation:pop .6s ease; }
  .opt.correct .bar { background:rgba(34,197,94,.5); }
  .opt.dim { opacity:.35; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
  .bottom { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .count { font-size:20px; opacity:.9; }
  button.main { background:#fff; color:#2a1470; border:0; border-radius:16px; padding:16px 28px; font-size:20px; font-weight:800; cursor:pointer; }
  button.main:active { transform:scale(.97); }
  .center { text-align:center; margin-top:14vh; }
  .center .big { font-size:72px; }
  input { font-size:22px; padding:12px 16px; border-radius:12px; border:0; text-align:center; width:220px; }
  .err { color:#fecaca; min-height:22px; }
</style>
</head>
<body>
<main id="app"></main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://igadvmjzyrylaxpacrew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fIO4K5Q3L63lnp4iuwn_hw_qZOc0NAb';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const LETTERS = ['A','B','C','D'];
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const voteUrl = location.href.replace(/presenter\.html.*$/, 'vote.html');

let pin = sessionStorage.getItem('quiz_pin') || '';
let questions = [];
let st = null, shownKey = '', results = [], correct = null, voteCount = 0;

if (!pin) askPin(); else start();

function askPin(msg = '') {
  app.innerHTML = `<div class="center"><div class="big">🎛️</div><h1>Pannello presentatore</h1>
    <p><input id="pin" type="password" placeholder="PIN" autofocus></p><p class="err">${esc(msg)}</p>
    <button class="main" id="go">Entra</button></div>`;
  const go = () => { pin = document.getElementById('pin').value.trim(); sessionStorage.setItem('quiz_pin', pin); start(); };
  document.getElementById('go').onclick = go;
  document.getElementById('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function start() {
  const { data } = await sb.from('quiz_questions').select('*').order('position');
  questions = data || [];
  tick(); setInterval(tick, 1500);
}

async function setState(phase, question) {
  const { error } = await sb.rpc('quiz_set_state', { p_pin: pin, p_phase: phase, p_question: question });
  if (error) { sessionStorage.removeItem('quiz_pin'); return askPin('PIN errato'); }
  tick();
}

async function tick() {
  const { data } = await sb.from('quiz_state').select('*').eq('id', 1).single();
  if (!data) return;
  st = data;
  const q = questions.find(x => x.id === st.current_question);

  if (q && st.phase === 'voting') {
    const { data: n } = await sb.rpc('quiz_vote_count', { p_question: q.id });
    voteCount = Number(n || 0);
  }
  const key = `${st.phase}:${st.current_question}:${voteCount}`;
  if (key === shownKey) return;

  if (q && (st.phase === 'results' || st.phase === 'revealed')) {
    if (!shownKey.startsWith(`${st.phase}:${st.current_question}:`)) {
      const { data: rows } = await sb.rpc('quiz_results', { p_question: q.id });
      results = rows || [];
      correct = null;
      if (st.phase === 'revealed') {
        const { data: k } = await sb.from('quiz_keys').select('correct_index').eq('question_id', q.id).maybeSingle();
        correct = k ? k.correct_index : null;
      }
    }
  }
  const prevPhaseKey = shownKey.split(':').slice(0, 2).join(':');
  shownKey = key;
  render(q, prevPhaseKey === `${st.phase}:${st.current_question}`);
}

function nextAction(q) {
  const idx = questions.findIndex(x => x.id === (q && q.id));
  switch (st.phase) {
    case 'waiting':  return ['▶ Avvia il quiz', () => setState('voting', questions[0].id)];
    case 'voting':   return ['📊 Chiudi i voti e mostra le percentuali', () => setState('results', q.id)];
    case 'results':  return ['✅ Mostra la risposta giusta', () => setState('revealed', q.id)];
    case 'revealed': return idx < questions.length - 1
                      ? ['➡ Prossima domanda', () => setState('voting', questions[idx + 1].id)]
                      : ['🏁 Concludi il quiz', () => setState('finished', q.id)];
    default:         return ['↺ Ricomincia (azzera i voti)', async () => { await sb.rpc('quiz_reset', { p_pin: pin }); tick(); }];
  }
}

function render(q, samePhase) {
  if (st.phase === 'waiting' || st.phase === 'finished' || !q) {
    const [label, fn] = nextAction(q);
    const title = st.phase === 'finished' ? 'Quiz concluso 🎉' : 'Tutto pronto';
    app.innerHTML = `<div class="center"><div class="big">${st.phase === 'finished' ? '🏆' : '🎤'}</div><h1>${title}</h1>
      <p class="link">Link per i partecipanti:<br><code>${esc(voteUrl)}</code></p><button class="main" id="act">${label}</button></div>`;
    document.getElementById('act').onclick = fn;
    return;
  }
  const total = results.reduce((a, r) => a + Number(r.n), 0);
  const count = i => Number(results.find(r => r.choice === i)?.n || 0);
  const showPct = st.phase !== 'voting';
  const opts = q.options.map((text, i) => {
    let cls = 'opt';
    if (st.phase === 'revealed' && correct !== null) cls += i === correct ? ' correct' : ' dim';
    const pct = total ? Math.round(count(i) / total * 100) : 0;
    return `<div class="${cls}"><div class="bar" data-w="${showPct ? pct : 0}"></div>
      <span class="letter">${LETTERS[i]}</span><span class="label">${esc(text)}</span>
      ${showPct ? `<span class="pct">${pct}%</span>` : ''}</div>`;
  }).join('');
  const [label, fn] = nextAction(q);
  const info = st.phase === 'voting' ? `🗳️ Hanno risposto: <b>${voteCount}</b>`
             : `Totale risposte: <b>${total}</b>`;
  app.innerHTML = `<div class="top"><span class="tag">Domanda ${q.position} di ${questions.length}</span>
      <span class="link">Partecipa: <code>${esc(voteUrl)}</code></span></div>
    <h1>${esc(q.text)}</h1><div class="opts">${opts}</div>
    <div class="bottom"><span class="count">${info}</span><button class="main" id="act">${label}</button></div>`;
  document.getElementById('act').onclick = fn;
  requestAnimationFrame(() => requestAnimationFrame(() => app.querySelectorAll('.bar').forEach(b => { b.style.width = b.dataset.w + '%'; })));
}
</script>
</body>
</html>
