<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Presentatore</title>
<style>
  :root { --bg1:#1b1464; --bg2:#4a1d8f; --card:rgba(255,255,255,.1); --ok:#22c55e; --gold:#fbbf24; --txt:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt);
         background: linear-gradient(160deg,var(--bg1),var(--bg2)); display:flex; justify-content:center; }
  main { width:100%; max-width:1040px; padding:24px 24px 48px; display:flex; flex-direction:column; gap:20px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .tag { font-size:14px; letter-spacing:.08em; text-transform:uppercase; opacity:.75; }
  .link { font-size:14px; opacity:.8; }
  .link code { background:rgba(255,255,255,.15); padding:3px 8px; border-radius:8px; }
  h1 { font-size:clamp(26px,4.2vw,44px); line-height:1.2; margin:0; }
  .opts { display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:760px) { .opts { grid-template-columns:1fr 1fr; } }
  .opt { position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; border:3px solid rgba(255,255,255,.18);
         background:var(--card); border-radius:20px; padding:18px; font-size:clamp(18px,2.3vw,25px); transition:opacity .4s, border-color .3s, box-shadow .4s; }
  .opt .letter { flex:0 0 44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-weight:800; z-index:1; }
  .opt .label { flex:1; z-index:1; }
  .opt .pct { font-weight:800; font-size:1.2em; z-index:1; font-variant-numeric:tabular-nums; text-align:right; }
  .opt .pct small { display:block; font-size:.55em; font-weight:600; opacity:.8; }
  .opt .bar { position:absolute; inset:0 auto 0 0; width:0; background:rgba(255,255,255,.24); transition:width 1s cubic-bezier(.2,.8,.2,1); }
  .opt.correct { border-color:var(--ok); box-shadow:0 0 0 6px rgba(34,197,94,.3), 0 0 50px rgba(34,197,94,.6); animation:pop .6s ease; }
  .opt.correct .bar { background:rgba(34,197,94,.5); }
  .opt.dim { opacity:.35; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
  .explain { display:flex; gap:20px; align-items:center; background:rgba(255,255,255,.08); border-left:6px solid var(--gold);
             border-radius:14px; padding:16px 20px; font-size:clamp(17px,1.9vw,22px); line-height:1.4; }
  .explain img { width:min(42%,380px); border-radius:10px; flex:none; }
  .bottom { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .count { font-size:20px; opacity:.9; }
  button.main { background:#fff; color:#2a1470; border:0; border-radius:16px; padding:16px 28px; font-size:20px; font-weight:800; cursor:pointer; }
  button.main:active { transform:scale(.97); }
  button.ghost { background:none; color:#fff; border:2px solid rgba(255,255,255,.5); border-radius:14px; padding:12px 20px; font-size:16px; cursor:pointer; }
  .center { text-align:center; margin-top:6vh; display:flex; flex-direction:column; gap:16px; align-items:center; }
  .center .big { font-size:64px; }
  .qr { background:#fff; padding:14px; border-radius:16px; line-height:0; }
  .qr svg, .qr img { width:240px; height:240px; }
  .podium { display:flex; align-items:flex-end; justify-content:center; gap:18px; margin-top:10px; }
  .step { width:220px; border-radius:18px 18px 0 0; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:16px 10px; gap:6px; }
  .step .medal { font-size:48px; }
  .step .who { font-size:26px; font-weight:800; word-break:break-word; }
  .step .pts { font-size:18px; opacity:.85; }
  .step.p1 { height:260px; background:rgba(251,191,36,.25); border:3px solid var(--gold); }
  .step.p2 { height:210px; }
  .step.p3 { height:170px; }
  input { font-size:22px; padding:12px 16px; border-radius:12px; border:0; text-align:center; width:220px; }
  .err { color:#fecaca; min-height:22px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .modal-bg { position:fixed; inset:0; background:rgba(10,6,40,.75); display:flex; align-items:center; justify-content:center; z-index:10; padding:20px; }
  .modal { background:#2a1a6e; border:2px solid rgba(255,255,255,.25); border-radius:20px; padding:28px 30px; max-width:560px; width:100%;
           display:flex; flex-direction:column; gap:16px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .modal h2 { margin:0; font-size:26px; }
  .modal p { margin:0; font-size:18px; line-height:1.4; opacity:.9; }
  .modal .row button { font-size:18px; padding:14px 22px; border-radius:14px; cursor:pointer; font-weight:800; }
  .modal .yes { background:#ef4444; color:#fff; border:0; }
  .modal .yes.soft { background:#fff; color:#2a1470; }
  .modal .no { background:none; color:#fff; border:2px solid rgba(255,255,255,.5); }
  .tools { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-start; border-top:1px solid rgba(255,255,255,.15); padding-top:14px; }
  .tools button, .tools a { background:none; color:#fff; border:1.5px solid rgba(255,255,255,.35); border-radius:12px; padding:8px 14px; font-size:14px; cursor:pointer; text-decoration:none; opacity:.85; }
  .tools button:hover, .tools a:hover { opacity:1; }
</style>
</head>
<body>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://igadvmjzyrylaxpacrew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fIO4K5Q3L63lnp4iuwn_hw_qZOc0NAb';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const QUIZ = new URLSearchParams(location.search).get('quiz') === '2' ? 2 : 1;
const OTHER = QUIZ === 1 ? 2 : 1;
const TITLES = { 1: 'Quiz 1 · Cartografia della Parola', 2: 'Quiz 2 · Come approcciare il testo biblico' };
document.title = 'Presentatore — ' + TITLES[QUIZ];
const LETTERS = ['A','B','C','D'];
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Indirizzi costruiti rispetto alla pagina: funzionano anche se il pannello è aperto senza ".html".
const voteUrl = new URL(`vote.html?quiz=${QUIZ}`, location.href).href;
const otherUrl = new URL(`presenter.html?quiz=${OTHER}`, location.href).href;
const adminUrl = new URL(`admin.html?quiz=${QUIZ}`, location.href).href;

let pin = sessionStorage.getItem('quiz_pin') || '';
let questions = [];
let st = null, shownKey = '', results = [], key = null, voteCount = 0, board = [], players = 0, timer = null;

function qrSvg(text) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
  catch { return ''; }
}

if (!pin) askPin(); else start();

function askPin(msg = '') {
  clearInterval(timer); timer = null;
  app.innerHTML = `<div class="center"><div class="big">🎛️</div><h1>Pannello presentatore</h1><p class="tag">${esc(TITLES[QUIZ])}</p>
    <p><input id="pin" type="password" placeholder="PIN" autofocus></p><p class="err">${esc(msg)}</p>
    <button class="main" id="go">Entra</button></div>`;
  const go = () => { pin = document.getElementById('pin').value.trim(); sessionStorage.setItem('quiz_pin', pin); start(); };
  document.getElementById('go').onclick = go;
  document.getElementById('pin').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function start() {
  const { data } = await sb.from('quiz_questions').select('*').eq('quiz', QUIZ).order('position');
  questions = data || [];
  shownKey = ''; tick();
  if (!timer) timer = setInterval(tick, 1500);
}

// Chiama una funzione protetta dal PIN. Solo se il PIN è sbagliato (errore P0001 dal database) lo richiede;
// per un problema di rete lascia il PIN e chiede di riprovare.
async function admin(fn, args) {
  const { error } = await sb.rpc(fn, { p_pin: pin, ...args });
  if (!error) { shownKey = ''; tick(); return true; }
  if (error.code === 'P0001') { sessionStorage.removeItem('quiz_pin'); askPin('PIN errato'); }
  else alert('Connessione assente o lenta: il comando non è arrivato. Riprova.');
  return false;
}

const setState = (phase, question) => admin('quiz_set_state', { p_quiz: QUIZ, p_phase: phase, p_question: question });

// Conferma con due pulsanti sulla pagina (al posto della finestrella del browser).
function ask(title, text, yes, soft = false) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(text)}</p>
      <div class="row"><button class="no">Annulla</button><button class="yes${soft ? ' soft' : ''}">${esc(yes)}</button></div></div>`;
    const close = v => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(false); };
    bg.querySelector('.no').onclick = () => close(false);
    bg.querySelector('.yes').onclick = () => close(true);
    bg.onclick = e => { if (e.target === bg) close(false); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    bg.querySelector('.no').focus();             // Invio per sbaglio annulla, non azzera
  });
}

async function resetQuiz() {
  const n = TITLES[QUIZ].split(' · ')[0];
  if (!await ask(`Azzerare il ${n}?`, `Si cancellano tutte le risposte del ${n} e si torna alla schermata iniziale. I nomi dei partecipanti restano. Non si può annullare.`, `Sì, azzera il ${n}`)) return;
  admin('quiz_reset', { p_quiz: QUIZ });
}

// Interrompe il quiz e mostra subito il podio. Contano solo le domande con la risposta già mostrata:
// se si interrompe durante il voto, quella domanda non vale.
async function stopQuiz() {
  if (!await ask('Interrompere il quiz?', 'Il quiz finisce adesso e compare la classifica. Contano solo le domande di cui hai già mostrato la risposta giusta.', 'Sì, interrompi', true)) return;
  const idx = questions.findIndex(x => x.id === st.current_question);
  const last = st.phase === 'revealed' ? questions[idx] : questions[idx - 1];
  admin('quiz_set_state', { p_quiz: QUIZ, p_phase: 'finished', p_question: last ? last.id : null });
}

async function resetAll() {
  if (!await ask('Azzerare tutto?', 'Si cancellano le risposte di entrambi i quiz e i nomi di tutti i partecipanti: dovranno riscriverli. Non si può annullare.', 'Sì, azzera tutto')) return;
  admin('quiz_reset_all', {});
}

let ticking = false, again = false;
async function tick() {
  if (ticking) { again = true; return; }
  ticking = true;
  try { await refresh(); } catch (e) { console.warn(e); }
  finally { ticking = false; if (again) { again = false; tick(); } }
}

async function refresh() {
  if (!questions.length) {
    const { data } = await sb.from('quiz_questions').select('*').eq('quiz', QUIZ).order('position');
    questions = data || [];
    if (!questions.length) { app.innerHTML = '<div class="center"><h1>Non riesco a caricare le domande</h1><p>Controlla la connessione: riprovo da solo.</p></div>'; shownKey = ''; return; }
  }
  const { data } = await sb.from('quiz_state').select('*').eq('id', QUIZ).single();
  if (!data) return;
  st = data;
  const q = questions.find(x => x.id === st.current_question);

  if (q && st.phase === 'voting') {
    const { data: n } = await sb.rpc('quiz_vote_count', { p_question: q.id });
    voteCount = Number(n || 0);
  }
  if (st.phase === 'waiting' || st.phase === 'finished') {
    const { data: n } = await sb.rpc('quiz_participants', { p_quiz: QUIZ });
    players = Number(n || 0);
  }
  const k = `${st.phase}:${st.current_question}:${voteCount}:${players}`;
  if (k === shownKey) return;

  const samePhase = shownKey.startsWith(`${st.phase}:${st.current_question}:`);
  if (!samePhase) {
    results = []; key = null; board = [];
    if (q && (st.phase === 'results' || st.phase === 'revealed')) {
      const { data: rows } = await sb.rpc('quiz_results', { p_question: q.id });
      results = rows || [];
    }
    if (q && st.phase === 'revealed') {
      const { data: kk } = await sb.from('quiz_keys').select('correct_index, note, image').eq('question_id', q.id).maybeSingle();
      key = kk;
    }
    if (st.phase === 'finished') {
      const { data: b } = await sb.rpc('quiz_leaderboard', { p_quiz: QUIZ });
      board = b || [];
    }
  }
  shownKey = k;
  render(q);
}

function nextAction(q) {
  const idx = questions.findIndex(x => x.id === (q && q.id));
  switch (st.phase) {
    case 'waiting':  return ['▶ Avvia il quiz', () => setState('voting', questions[0].id)];
    case 'voting':   return ['📊 Chiudi i voti e mostra le percentuali', () => setState('results', q.id)];
    case 'results':  return ['✅ Mostra la risposta giusta', () => setState('revealed', q.id)];
    case 'revealed': return idx < questions.length - 1
                      ? ['➡ Prossima domanda', () => setState('voting', questions[idx + 1].id)]
                      : ['🏁 Concludi e mostra la classifica', () => setState('finished', q.id)];
    default:         return ['↺ Ricomincia questo quiz (azzera i voti)', resetQuiz];
  }
}

const tools = (extra = '') => `<div class="tools">${extra}<button id="t-rst">↺ Azzera questo quiz</button>
  <a href="${esc(adminUrl)}" target="_blank" rel="opener">📋 Risposte di tutti</a></div>`;
function wireTools() {
  const s = document.getElementById('t-stop'); if (s) s.onclick = stopQuiz;
  document.getElementById('t-rst').onclick = resetQuiz;
}

function render(q) {
  const [label, fn] = nextAction(q);
  if (st.phase === 'waiting' || (!q && st.phase !== 'finished')) {
    app.innerHTML = `<div class="center"><span class="tag">${esc(TITLES[QUIZ])} · ${questions.length} domande</span>
      <h1>Inquadra il codice e scrivi il tuo nome</h1>
      <div class="qr">${qrSvg(voteUrl)}</div>
      <p class="link"><code>${esc(voteUrl)}</code></p>
      <button class="main" id="act">${label}</button>
      <div class="row"><button class="ghost" id="rst">Azzera i voti di questo quiz</button>
      <button class="ghost" id="all">Azzera tutto (anche i nomi)</button>
      <button class="ghost" id="other">Vai al quiz ${OTHER}</button>
      <a class="ghost" style="text-decoration:none;display:inline-block" href="${esc(adminUrl)}" target="_blank" rel="opener">📋 Risposte di tutti</a></div></div>`;
    document.getElementById('act').onclick = fn;
    document.getElementById('rst').onclick = resetQuiz;
    document.getElementById('all').onclick = resetAll;
    document.getElementById('other').onclick = () => { location.href = otherUrl; };
    return;
  }
  if (st.phase === 'finished') {
    const medals = ['🥇','🥈','🥉'];
    const order = [2, 1, 3].map(p => board.find(r => r.place === p)).filter(Boolean);
    const cur = questions.find(x => x.id === st.current_question);
    const counted = cur ? cur.position : 0;   // domande che contano (meno di tutte se il quiz è stato interrotto)
    const pod = order.map(r => `<div class="step p${r.place}"><div class="medal">${medals[r.place - 1]}</div>
      <div class="who">${esc(r.name)}</div><div class="pts">${r.correct} su ${counted}</div></div>`).join('');
    app.innerHTML = `<div class="center"><span class="tag">${esc(TITLES[QUIZ])}</span><h1>Quiz concluso 🎉</h1>
      ${pod ? `<div class="podium">${pod}</div>` : '<p>Nessuna risposta giusta registrata.</p>'}
      <p class="link">${counted < questions.length ? `Quiz interrotto: contano ${counted} domande su ${questions.length}. ` : ''}Partecipanti: <b>${players}</b>. A parità di risposte giuste vince chi ha risposto più in fretta.</p>
      <div class="row"><button class="main" id="act">${label}</button>
      <button class="ghost" id="other">Vai al quiz ${OTHER}</button>
      <button class="ghost" id="all">Azzera tutto (anche i nomi)</button>
      <a class="ghost" style="text-decoration:none;display:inline-block" href="${esc(adminUrl)}" target="_blank" rel="opener">📋 Risposte di tutti</a></div></div>`;
    document.getElementById('act').onclick = fn;
    document.getElementById('other').onclick = () => { location.href = otherUrl; };
    document.getElementById('all').onclick = resetAll;
    return;
  }

  const total = results.reduce((a, r) => a + Number(r.n), 0);
  const count = i => Number(results.find(r => r.choice === i)?.n || 0);
  const showPct = st.phase !== 'voting';
  const correct = key ? key.correct_index : null;
  const opts = q.options.map((text, i) => {
    let cls = 'opt';
    if (correct !== null) cls += i === correct ? ' correct' : ' dim';
    const pct = total ? Math.round(count(i) / total * 100) : 0;
    return `<div class="${cls}"><div class="bar" data-w="${showPct ? pct : 0}"></div>
      <span class="letter">${LETTERS[i]}</span><span class="label">${esc(text)}</span>
      ${showPct ? `<span class="pct">${pct}%<small>${count(i)} ${count(i) === 1 ? 'persona' : 'persone'}</small></span>` : ''}</div>`;
  }).join('');
  const explain = key && (key.note || key.image)
    ? `<div class="explain">${key.image ? `<img src="${esc(key.image)}" alt="">` : ''}<div>${esc(key.note)}</div></div>` : '';
  const info = st.phase === 'voting' ? `🗳️ Hanno risposto: <b>${voteCount}</b>`
             : correct !== null ? `Hanno indovinato <b>${count(correct)}</b> su ${total}` : `Totale risposte: <b>${total}</b>`;
  app.innerHTML = `<div class="top"><span class="tag">${esc(TITLES[QUIZ])} · Domanda ${q.position} di ${questions.length}</span>
      <span class="link">Partecipa: <code>${esc(voteUrl)}</code></span></div>
    <h1>${esc(q.text)}</h1><div class="opts">${opts}</div>${explain}
    <div class="bottom"><span class="count">${info}</span><button class="main" id="act">${label}</button></div>
    ${tools('<button id="t-stop">⏹ Interrompi e mostra la classifica</button>')}`;
  document.getElementById('act').onclick = fn;
  wireTools();
  requestAnimationFrame(() => requestAnimationFrame(() => app.querySelectorAll('.bar').forEach(b => { b.style.width = b.dataset.w + '%'; })));
}
</script>
</body>
</html>
